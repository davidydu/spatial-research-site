name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild daily at 06:00 UTC so the site picks up spec changes
    # (the spec repo doesn't trigger this workflow; the schedule does)
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone spec repo into content/
        # Direct git clone avoids actions/checkout's mkdir conflict
        # with gitignored paths. Works for public spec; for a private
        # spec, switch to actions/checkout and provide a token via
        # SPEC_REPO_PAT secret.
        run: git clone --depth 1 https://github.com/davidydu/spatial-research.git content

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
